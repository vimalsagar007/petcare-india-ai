[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petcare-india-ai"
version = "1.0.0"
description = "Your Intelligent Veterinary & Animal Care Assistant for India"
readme = "README.md"
authors = [{ name = "PetCare India Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "google-genai>=0.1.0",
    "google-cloud-aiplatform>=1.42.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
